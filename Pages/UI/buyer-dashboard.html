<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | MarketView Buyer Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --primary-glow: rgba(251, 191, 36, 0.25);
            --glass: rgba(13, 22, 30, 0.78);
            --glass-card: rgba(18, 29, 40, 0.88);
            --glass-border: rgba(245, 158, 11, 0.25);
            --text-main: #FFFFFF;
            --text-dim: #94a3b8;
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Archivo', sans-serif; }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(rgba(10, 25, 30, 0.82), rgba(5, 12, 18, 0.92)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(10, 17, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-brand { display: flex; align-items: center; gap: 14px; }
        .logo-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden; background: rgba(8, 15, 22, 0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-main); text-transform: uppercase; }
        .brand-title span { color: var(--primary); }

        .nav-links { display: flex; gap: 24px; align-items: center; position: relative; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: color 0.2s ease;
            display: flex; align-items: center; gap: 6px;
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        /* --- DETAILED HOVER TOOLTIP STYLING --- */
        .nav-links a::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -48px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(10, 17, 24, 0.98);
            color: #cbd5e1;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            pointer-events: none;
            letter-spacing: 0.3px;
            line-height: 1.4;
            text-align: center;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent var(--glass-border) transparent;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            pointer-events: none;
        }

        .nav-links a:hover::after,
        .nav-links a:hover::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- CONTAINER & SEARCH --- */
        .container {
            max-width: 1280px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .search-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--glass);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
        }

        .header-content { display: flex; flex-direction: column; gap: 4px; }
        h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
        
        .verified-intro {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .verified-intro i { color: var(--success); font-size: 0.7rem; }

        .search-bar {
            position: relative;
            flex: 1;
            max-width: 380px;
            min-width: 250px;
        }

        .search-bar i {
            position: absolute; left: 16px; top: 14px;
            color: var(--primary); font-size: 0.85rem;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 42px;
            background: rgba(8, 14, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        /* --- PRODUCT GRID --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(251, 191, 36, 0.15);
            border-color: rgba(245, 158, 11, 0.5);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background: #050b10;
            overflow: hidden;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .product-card:hover .product-img { transform: scale(1.05); }

        .product-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .product-price { font-family: 'Roboto Mono', monospace; font-size: 1.1rem; color: var(--primary); font-weight: 700; margin-bottom: 12px; }
        .product-desc { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px; flex: 1; line-height: 1.5; }

        .button-group { display: flex; gap: 10px; }

        /* Modern Styled Buttons */
        .btn {
            flex: 1;
            padding: 11px 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #091118;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 8, 12, 0.8);
            backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: #0e1721;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 480px;
            max-width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h3 { margin-bottom: 20px; font-size: 1.35rem; color: var(--primary); font-weight: 800; }
        .modal-close { 
            position: absolute; right: 22px; top: 22px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); cursor: pointer; font-size: 1rem; transition: all 0.2s ease;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            width: 100%; padding: 12px 16px;
            background: rgba(6, 11, 16, 0.95);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #fff; font-size: 0.85rem;
            outline: none; transition: border-color 0.2s ease;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        .seller-info {
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.15);
            padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #e2e8f0;
        }
        .seller-info strong { color: var(--primary); }

        .status-banner { margin-top: 15px; font-size: 0.8rem; text-align: center; display: none; padding: 10px; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <div class="logo-ring">
                <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <span class="brand-title">MarketView <span>[Buyer Terminal]</span></span>
        </div>
        <div class="nav-links">
            <a href="buyer-dashboard.html" class="active" data-tooltip="Browse verified vendor catalog, search items, and place direct purchase orders"><i class="fa-solid fa-store"></i> Marketplace</a>
            <a href="buyer-orders.html" data-tooltip="Track active delivery shipments, fulfillment progress, and past order records"><i class="fa-solid fa-box"></i> My Purchases</a>
            <a href="buyer-messages.html" data-tooltip="Securely chat with verified vendors and manage direct product inquiries"><i class="fa-solid fa-comments"></i> Messages</a>
            <a href="../SignUp.html" style="color: var(--danger);" data-tooltip="Securely terminate your active session and log out of the terminal"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="search-section">
            <div class="header-content">
                <h1>Marketplace Directory</h1>
                <div class="verified-intro">
                    <i class="fa-solid fa-shield-check"></i> Secure buyer terminal featuring verified vendor listings and direct product inquiries.
                </div>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>
        </div>

        <div id="productGrid" class="product-grid">
            <!-- Dynamically populated products -->
        </div>
    </div>

    <!-- Secure Order Checkout Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <span class="modal-close" id="closeModal"><i class="fa-solid fa-xmark"></i></span>
            <h3>Secure Order Checkout</h3>
            <div class="seller-info" id="sellerInfoContainer">
                Retrieving seller verification...
            </div>
            <form id="orderForm">
                <div class="form-group">
                    <label>Street Address</label>
                    <input type="text" id="orderAddress" class="form-control" required placeholder="Enter street address">
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="orderCity" class="form-control" required placeholder="Enter city">
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" id="orderCountry" class="form-control" required placeholder="Enter country">
                </div>
                <button type="submit" class="btn" style="width:100%; margin-top: 10px; padding: 13px;" id="submitOrderBtn">Confirm & Place Order</button>
            </form>
            <div id="modalStatus" class="status-banner"></div>
        </div>
    </div>

    <!-- Product Inquiry / Message Modal -->
    <div class="modal-overlay" id="inquiryModal">
        <div class="modal">
            <span class="modal-close" id="closeInquiryModal"><i class="fa-solid fa-xmark"></i></span>
            <h3>Enquire About Product</h3>
            <div class="seller-info" id="inquirySellerInfo">
                Retrieving vendor details...
            </div>
            <form id="inquiryForm">
                <div class="form-group">
                    <label>Your Inquiry Message</label>
                    <textarea id="inquiryMessageText" class="form-control" rows="4" required placeholder="Hi, I am interested in inquiring about this product. Is it still available?"></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%; margin-top: 10px; padding: 13px;" id="submitInquiryBtn">Send Message to Vendor</button>
            </form>
            <div id="inquiryStatus" class="status-banner"></div>
        </div>
    </div>

    <script type="module">
        import { RandomProducts } from '../../Cloud/Functions/RandomProducts.js';
        import { SearchProduct } from '../../Cloud/Functions/SearchProduct.js';
        import { RetrieveProductUserDetails } from '../../Cloud/Functions/GetProductUserDetails.js';
        import { PlaceProductOrder } from '../../Cloud/Functions/PlaceProductOrder.js';
        import { RetrieveUserDetails } from '../../Cloud/Functions/RetrieveUserDetails.js';
        import { SendMessage } from '../../Cloud/Functions/SendMessage.js';

        let selectedProductId = null;
        let activeSellerId = null;
        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        
        const orderModal = document.getElementById('orderModal');
        const closeModal = document.getElementById('closeModal');

        const inquiryModal = document.getElementById('inquiryModal');
        const closeInquiryModal = document.getElementById('closeInquiryModal');

        // Load buyer profile details in the navbar
        async function initUserProfile() {
            try {
                const details = await RetrieveUserDetails();
                if (details && details.length > 0) {
                    const user = details[0];
                    const brandTitle = document.querySelector('.brand-title');
                    if (brandTitle) {
                        brandTitle.innerHTML = `MarketView <span>[Buyer: ${user.name || user.username || 'Terminal'}]</span>`;
                    }
                }
            } catch (err) {
                console.error("Error loading user profile:", err);
            }
        }
        initUserProfile();

        function renderProducts(productList) {
            productGrid.innerHTML = '';
            if (!productList || productList.length === 0) {
                productGrid.innerHTML = '<p style="color: var(--text-dim); grid-column: span 100; text-align: center; padding: 40px;">No products available at the moment.</p>';
                return;
            }

            productList.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const pId = prod.Productid || prod.productid;
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${prod.MediaLink || 'logo.jpg'}" class="product-img" alt="Product">
                    </div>
                    <div class="product-body">
                        <div class="product-name">${prod.ProductName || prod.name}</div>
                        <div class="product-price">$${prod.ProductPrice || prod.price}</div>
                        <div class="product-desc">${prod.ProductDescription || prod.description || 'No description provided.'}</div>
                        <div class="button-group">
                            <button class="btn btn-secondary" onclick="openInquiryModal('${pId}')">Enquire</button>
                            <button class="btn" onclick="openOrderModal('${pId}')">Purchase</button>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        async function loadMarketplace() {
            try {
                const data = await RandomProducts();
                renderProducts(data);
            } catch (err) {
                console.error("Error loading marketplace products:", err);
                productGrid.innerHTML = '<p style="color: var(--danger); text-align: center; grid-column: span 100;">Failed to load products.</p>';
            }
        }
        loadMarketplace();

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = e.target.value.trim();
                if (query === '') {
                    loadMarketplace();
                } else {
                    const results = await SearchProduct(query);
                    renderProducts(results);
                }
            }, 350);
        });

        window.openOrderModal = async function(productId) {
            selectedProductId = productId;
            orderModal.style.display = 'flex';
            document.getElementById('sellerInfoContainer').innerHTML = 'Retrieving seller verification...';
            document.getElementById('modalStatus').style.display = 'none';

            try {
                const userDetails = await RetrieveProductUserDetails(productId);
                if (userDetails && userDetails.length > 0) {
                    const seller = userDetails[0];
                    document.getElementById('sellerInfoContainer').innerHTML = `
                        <strong>Verified Seller:</strong> ${seller.Name || ''} ${seller.Surname || ''} (@${seller.Username || 'unknown'})
                    `;
                } else {
                    document.getElementById('sellerInfoContainer').innerHTML = 'Seller verification unavailable.';
                }
            } catch (err) {
                document.getElementById('sellerInfoContainer').innerHTML = 'Seller verification unavailable.';
            }
        }

        window.openInquiryModal = async function(productId) {
            selectedProductId = productId;
            inquiryModal.style.display = 'flex';
            document.getElementById('inquirySellerInfo').innerHTML = 'Retrieving vendor details...';
            document.getElementById('inquiryStatus').style.display = 'none';
            document.getElementById('inquiryMessageText').value = '';

            try {
                const userDetails = await RetrieveProductUserDetails(productId);
                if (userDetails && userDetails.length > 0) {
                    const seller = userDetails[0];
                    activeSellerId = seller.id || seller.UserId || seller.userid;
                    document.getElementById('inquirySellerInfo').innerHTML = `
                        <strong>Vendor:</strong> ${seller.Name || ''} ${seller.Surname || ''} (@${seller.Username || 'unknown'})
                    `;
                } else {
                    document.getElementById('inquirySellerInfo').innerHTML = 'Vendor information unavailable.';
                }
            } catch (err) {
                document.getElementById('inquirySellerInfo').innerHTML = 'Vendor information unavailable.';
            }
        }

        closeModal.addEventListener('click', () => { orderModal.style.display = 'none'; });
        closeInquiryModal.addEventListener('click', () => { inquiryModal.style.display = 'none'; });

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitOrderBtn');
            const address = document.getElementById('orderAddress').value.trim();
            const city = document.getElementById('orderCity').value.trim();
            const country = document.getElementById('orderCountry').value.trim();
            const statusBanner = document.getElementById('modalStatus');

            btn.disabled = true;
            btn.innerHTML = 'Processing Order...';

            try {
                const response = await PlaceProductOrder(selectedProductId, address, city, country);
                
                statusBanner.style.display = 'block';
                if (response) {
                    statusBanner.style.background = 'rgba(52, 211, 153, 0.15)';
                    statusBanner.style.color = '#34d399';
                    statusBanner.textContent = 'Order placed successfully!';
                    setTimeout(() => {
                        orderModal.style.display = 'none';
                        btn.disabled = false;
                        btn.innerHTML = 'Confirm & Place Order';
                        document.getElementById('orderForm').reset();
                    }, 1500);
                } else {
                    throw new Error('Order submission returned empty response.');
                }
            } catch (err) {
                statusBanner.style.display = 'block';
                statusBanner.style.background = 'rgba(248, 113, 113, 0.15)';
                statusBanner.style.color = '#f87171';
                statusBanner.textContent = 'Failed to place order. Try again.';
                btn.disabled = false;
                btn.innerHTML = 'Confirm & Place Order';
            }
        });

        document.getElementById('inquiryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitInquiryBtn');
            const messageText = document.getElementById('inquiryMessageText').value.trim();
            const statusBanner = document.getElementById('inquiryStatus');

            if (!activeSellerId) {
                alert('Vendor recipient ID not found.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Sending Inquiry...';

            try {
                const response = await SendMessage(activeSellerId, messageText, selectedProductId);
                
                statusBanner.style.display = 'block';
                statusBanner.style.background = 'rgba(52, 211, 153, 0.15)';
                statusBanner.style.color = '#34d399';
                statusBanner.textContent = 'Inquiry sent successfully!';
                setTimeout(() => {
                    inquiryModal.style.display = 'none';
                    btn.disabled = false;
                    btn.innerHTML = 'Send Message to Vendor';
                    window.location.href = 'buyer-messages.html';
                }, 1200);
            } catch (err) {
                statusBanner.style.display = 'block';
                statusBanner.style.background = 'rgba(248, 113, 113, 0.15)';
                statusBanner.style.color = '#f87171';
                statusBanner.textContent = 'Failed to send inquiry. Try again.';
                btn.disabled = false;
                btn.innerHTML = 'Send Message to Vendor';
            }
        });
    </script>
</body>
</html>

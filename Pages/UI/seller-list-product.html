<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Product | MarketView Seller Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --primary-glow: rgba(251, 191, 36, 0.25);
            --glass: rgba(13, 22, 30, 0.78);
            --glass-border: rgba(245, 158, 11, 0.25);
            --text-main: #FFFFFF;
            --text-dim: #94a3b8;
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Archivo', sans-serif; }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(rgba(10, 25, 30, 0.82), rgba(5, 12, 18, 0.92)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(10, 17, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-brand { display: flex; align-items: center; gap: 14px; }
        .logo-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden; background: rgba(8, 15, 22, 0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-main); text-transform: uppercase; }
        .brand-title span { color: var(--primary); }

        .nav-links { display: flex; gap: 20px; align-items: center; position: relative; flex-wrap: wrap; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: color 0.2s ease; display: flex; align-items: center; gap: 6px; position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        /* --- DETAILED HOVER TOOLTIP STYLING --- */
        .nav-links a::after {
            content: attr(data-tooltip);
            position: absolute; bottom: -48px; left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(10, 17, 24, 0.98); color: #cbd5e1;
            padding: 10px 14px; border-radius: 10px; font-size: 0.72rem; font-weight: 500;
            white-space: nowrap; border: 1px solid var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            opacity: 0; visibility: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none; letter-spacing: 0.3px; line-height: 1.4; text-align: center;
        }
        .nav-links a::before {
            content: ''; position: absolute; bottom: -16px; left: 50%;
            transform: translateX(-50%) translateY(5px); border-width: 5px; border-style: solid;
            border-color: transparent transparent var(--glass-border) transparent;
            opacity: 0; visibility: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none;
        }
        .nav-links a:hover::after, .nav-links a:hover::before {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }

        /* --- CONTAINER & CARD --- */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        .header-section {
            display: flex; flex-direction: column; gap: 4px;
            margin-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 20px;
        }

        h2 {
            font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        h2 i { color: var(--primary); }

        .verified-intro {
            font-size: 0.75rem; color: var(--text-dim); font-weight: 500;
            display: flex; align-items: center; gap: 6px; margin-top: 4px;
        }
        .verified-intro i { color: var(--success); font-size: 0.7rem; }

        /* --- FORMS --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group.full { grid-column: span 2; }
        .form-group label {
            display: block; font-size: 0.75rem; color: var(--text-dim);
            margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%; padding: 12px 16px;
            background: rgba(6, 11, 16, 0.95); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; transition: border-color 0.2s ease;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        input[type="file"].form-control { padding: 9px 12px; cursor: pointer; }

        .btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #091118; border: none; border-radius: 10px; font-weight: 800;
            font-size: 0.8rem; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-glow); transition: opacity 0.2s ease, transform 0.1s ease; margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }

        .status-message { margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 0.8rem; display: none; text-align: center; font-weight: 600; }
        .status-message.success { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .status-message.error { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <div class="logo-ring">
                <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <span class="brand-title">MarketView <span>[Seller Studio]</span></span>
        </div>
        <!-- 4-Step Streamlined Seller Navigation -->
        <div class="nav-links">
            <a href="seller-messages.html" data-tooltip="Communicate directly with clients, handle inquiries, and manage negotiations"><i class="fa-solid fa-comments"></i> 1. Messages</a>
            <a href="seller-orders.html" data-tooltip="Monitor incoming orders, customer fulfillment requests, and sales records"><i class="fa-solid fa-receipt"></i> 2. Orders</a>
            <a href="seller-list-product.html" class="active" data-tooltip="Publish new product items with media attachments and specifications"><i class="fa-solid fa-circle-plus"></i> 3. List Product</a>
            <a href="seller-inventory.html" data-tooltip="View and manage active stock inventory published on the marketplace network"><i class="fa-solid fa-boxes-stacked"></i> 4. Inventory</a>
            <a href="#" id="downloadUserManual" data-tooltip="Download official MarketView Seller Studio User Manual text file"><i class="fa-solid fa-file-lines"></i> User Manual</a>
            <a href="../SignUp.html" style="color: var(--danger);" data-tooltip="Securely terminate your active studio session and log out"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-section">
                <h2><i class="fa-solid fa-circle-plus"></i> List New Product</h2>
                <div class="verified-intro">
                    <i class="fa-solid fa-bolt"></i> Publish new inventory items instantly with media attachments and location specifications.
                </div>
            </div>
            <form id="addProductForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Product Name</label>
                        <input type="text" id="prodName" class="form-control" required placeholder="e.g. Cargo Pants">
                    </div>
                    <div class="form-group">
                        <label>Price (ZAR / Rands)</label>
                        <input type="number" step="0.01" id="prodPrice" class="form-control" required placeholder="249.99">
                    </div>
                    <div class="form-group">
                        <label>Product Image File</label>
                        <input type="file" id="prodImage" class="form-control" accept="image/*" required>
                    </div>
                    <div class="form-group full">
                        <label>Description</label>
                        <textarea id="prodDesc" class="form-control" rows="3" required placeholder="Product specifications and details..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Street Address</label>
                        <input type="text" id="prodAddress" class="form-control" required placeholder="e.g. 32 Oribi Road">
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="prodCity" class="form-control" required placeholder="e.g. Pietermaritzburg">
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" id="prodCountry" class="form-control" required placeholder="e.g. South Africa">
                    </div>
                </div>
                <button type="submit" class="btn" id="submitBtn">Publish Product Listing</button>
            </form>
            <div id="formStatus" class="status-message"></div>
        </div>
    </div>

    <script type="module">
        import { AddProduct } from '../../Cloud/Functions/AddProduct.js';
        import { AddPic } from '../../Cloud/Functions/AddPic.js';
        import { RetrieveUserDetails } from '../../Cloud/Functions/RetrieveUserDetails.js';

        const addProductForm = document.getElementById('addProductForm');
        const formStatus = document.getElementById('formStatus');

        async function initUserProfile() {
            try {
                const details = await RetrieveUserDetails();
                if (details && details.length > 0) {
                    const user = details[0];
                    const brandTitle = document.querySelector('.brand-title');
                    if (brandTitle) {
                        brandTitle.innerHTML = `MarketView <span>[Seller: ${user.name || user.username || 'Studio'}]</span>`;
                    }
                }
            } catch (err) {
                console.error("Error loading user profile:", err);
            }
        }
        initUserProfile();

        // --- SELLER STUDIO PLAIN-TEXT USER MANUAL GENERATOR ---
        document.getElementById('downloadUserManual').addEventListener('click', (e) => {
            e.preventDefault();
            
            const manualContent = 
`==================================================
MARKETVIEW SELLER STUDIO - OFFICIAL USER MANUAL
Version 2.4 (2026)
==================================================

1. PLATFORM OVERVIEW & ARCHITECTURE
MarketView Seller Studio is a high-performance management terminal designed for merchants to publish catalog listings, monitor incoming purchase demand, and negotiate directly with buyers through encrypted messaging channels.

2. STREAMLINED NAVIGATION WORKFLOWS
[1] MESSAGES (seller-messages.html): Engage directly with buyers regarding product inquiries and negotiations.
[2] ORDERS (seller-orders.html): Monitor customer purchase requests, delivery destinations, and update fulfillment statuses.
[3] LIST PRODUCT (seller-list-product.html): Publish new product listings with media attachments, pricing, and location specs.
[4] INVENTORY (seller-inventory.html): Inspect and manage all currently published studio items fetched via RetrieveUserProducts().

3. SECURITY & COMPLIANCE
All seller accounts operate under strict cryptographic session validation. Media assets are securely stored in cloud storage buckets, ensuring data integrity across all merchant transactions.

--------------------------------------------------
(c) 2026 MarketView Digital Agency. All rights reserved.
Confidential Technical Documentation.
--------------------------------------------------`;

            const blob = new Blob([manualContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = 'MarketView_Seller_Manual.txt';
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        });

        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const desc = document.getElementById('prodDesc').value.trim();
            const address = document.getElementById('prodAddress').value.trim();
            const city = document.getElementById('prodCity').value.trim();
            const country = document.getElementById('prodCountry').value.trim();
            const fileInput = document.getElementById('prodImage');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading media...';
            formStatus.style.display = 'none';

            try {
                let mediaLink = '';
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `product_${Date.now()}_${file.name}`;
                    mediaLink = await AddPic('Products', file, fileName);
                }
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing listing...';
                const result = await AddProduct(name, price, desc, address, city, mediaLink || '', country);
                if (result) {
                    formStatus.style.display = 'block';
                    formStatus.className = 'status-message success';
                    formStatus.textContent = 'Product successfully published! Redirecting to inventory...';
                    addProductForm.reset();
                    setTimeout(() => {
                        window.location.href = 'seller-inventory.html';
                    }, 1500);
                } else {
                    throw new Error("Failed to register product record.");
                }
            } catch (err) {
                formStatus.style.display = 'block';
                formStatus.className = 'status-message error';
                formStatus.textContent = err.message || 'Error publishing product.';
                btn.disabled = false;
                btn.innerHTML = 'Publish Product Listing';
            }
        });
    </script>
</body>
</html>

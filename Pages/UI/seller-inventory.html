<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | MarketView Seller Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --primary-glow: rgba(251, 191, 36, 0.25);
            --glass: rgba(13, 22, 30, 0.78);
            --glass-card: rgba(18, 29, 40, 0.88);
            --glass-border: rgba(245, 158, 11, 0.25);
            --text-main: #FFFFFF;
            --text-dim: #94a3b8;
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Archivo', sans-serif; }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(rgba(10, 25, 30, 0.82), rgba(5, 12, 18, 0.92)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(10, 17, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-brand { display: flex; align-items: center; gap: 14px; }
        .logo-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden; background: rgba(8, 15, 22, 0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-main); text-transform: uppercase; }
        .brand-title span { color: var(--primary); }

        .nav-links { display: flex; gap: 24px; align-items: center; position: relative; flex-wrap: wrap; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: color 0.2s ease;
            display: flex; align-items: center; gap: 6px;
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        /* --- DETAILED HOVER TOOLTIP STYLING --- */
        .nav-links a::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -48px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(10, 17, 24, 0.98);
            color: #cbd5e1;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            pointer-events: none;
            letter-spacing: 0.3px;
            line-height: 1.4;
            text-align: center;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent var(--glass-border) transparent;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            pointer-events: none;
        }

        .nav-links a:hover::after,
        .nav-links a:hover::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- CONTAINER & CARDS --- */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title-group h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.3px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .header-title-group h2 i { color: var(--primary); }

        .verified-intro {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .verified-intro i { color: var(--success); font-size: 0.7rem; }

        .btn-action {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #091118;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: opacity 0.2s ease;
        }
        .btn-action:hover { opacity: 0.9; }

        /* --- PRODUCT GRID --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .product-card:hover { transform: translateY(-3px); }

        .product-img { width: 100%; height: 160px; object-fit: cover; background: #050b10; }
        .product-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-size: 1rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .product-price { font-family: 'Roboto Mono', monospace; font-size: 0.95rem; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
        .product-desc { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 14px; flex: 1; line-height: 1.5; }
        .product-location { font-size: 0.7rem; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; display: flex; align-items: center; gap: 6px; }
        .product-location i { color: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <div class="logo-ring">
                <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <span class="brand-title">MarketView <span>[Seller Studio]</span></span>
        </div>
        <div class="nav-links">
            <a href="seller-inventory.html" class="active" data-tooltip="View and manage active stock listings published on the marketplace network"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
            <a href="seller-list-product.html" data-tooltip="Publish new product inventory items with media attachments and specifications"><i class="fa-solid fa-circle-plus"></i> List Product</a>
            <a href="seller-orders.html" data-tooltip="Review, accept, decline, or fulfill incoming customer purchase requests"><i class="fa-solid fa-receipt"></i> Incoming Requests</a>
            <a href="seller-messages.html" data-tooltip="Communicate directly with clients regarding product inquiries and orders"><i class="fa-solid fa-comments"></i> Messages</a>
            <a href="../SignUp.html" style="color: var(--danger);" data-tooltip="Securely terminate your active studio session and log out"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-section">
                <div class="header-title-group">
                    <h2><i class="fa-solid fa-box-archive"></i> Active Inventory</h2>
                    <div class="verified-intro">
                        <i class="fa-solid fa-shield-check"></i> Manage and view all live stock listings currently published on the marketplace.
                    </div>
                </div>
                <a href="seller-list-product.html" class="btn-action"><i class="fa-solid fa-plus"></i> List New Item</a>
            </div>
            <div id="myProductGrid" class="product-grid">
                <!-- Dynamically loaded inventory items -->
            </div>
        </div>
    </div>

    <script type="module">
        import { RetrieveUserProducts } from '../../Cloud/Functions/RetrieveUserProducts.js';
        import { RetrieveUserDetails } from '../../Cloud/Functions/RetrieveUserDetails.js';

        const myProductGrid = document.getElementById('myProductGrid');

        async function initUserProfile() {
            try {
                const details = await RetrieveUserDetails();
                if (details && details.length > 0) {
                    const user = details[0];
                    const brandTitle = document.querySelector('.brand-title');
                    if (brandTitle) {
                        brandTitle.innerHTML = `MarketView <span>[Seller: ${user.name || user.username || 'Studio'}]</span>`;
                    }
                }
            } catch (err) {
                console.error("Error loading user profile:", err);
            }
        }
        initUserProfile();

        async function loadUserProducts() {
            try {
                const products = await RetrieveUserProducts();
                myProductGrid.innerHTML = '';
                if (!products || products.length === 0) {
                    myProductGrid.innerHTML = '<p style="color: var(--text-dim); grid-column: span 100; text-align: center; padding: 40px;">Your inventory is empty. Click "List New Item" above to add products.</p>';
                    return;
                }

                products.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${prod.MediaLink || 'logo.jpg'}" class="product-img" alt="Item">
                        <div class="product-body">
                            <div class="product-name">${prod.ProductName || prod.name}</div>
                            <div class="product-price">R${prod.ProductPrice || prod.price}</div>
                            <div class="product-desc">${prod.ProductDescription || prod.description || ''}</div>
                            <div class="product-location"><i class="fa-solid fa-location-dot"></i> ${prod.City || ''}, ${prod.Country || ''}</div>
                        </div>
                    `;
                    myProductGrid.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading user inventory:", err);
                myProductGrid.innerHTML = '<p style="color: var(--danger); text-align: center; grid-column: span 100;">Failed to load inventory.</p>';
            }
        }
        loadUserProducts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purchases | MarketView Buyer Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --primary-glow: rgba(251, 191, 36, 0.25);
            --glass: rgba(13, 22, 30, 0.78);
            --glass-card: rgba(18, 29, 40, 0.88);
            --glass-border: rgba(245, 158, 11, 0.25);
            --text-main: #FFFFFF;
            --text-dim: #94a3b8;
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Archivo', sans-serif; }

        body {
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(rgba(10, 25, 30, 0.82), rgba(5, 12, 18, 0.92)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(10, 17, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-brand { display: flex; align-items: center; gap: 14px; }
        .logo-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden; background: rgba(8, 15, 22, 0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-main); text-transform: uppercase; }
        .brand-title span { color: var(--primary); }

        .nav-links { display: flex; gap: 24px; align-items: center; position: relative; flex-wrap: wrap; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: color 0.2s ease; display: flex; align-items: center; gap: 6px; position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        /* --- DETAILED HOVER TOOLTIP STYLING --- */
        .nav-links a::after {
            content: attr(data-tooltip);
            position: absolute; bottom: -48px; left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(10, 17, 24, 0.98); color: #cbd5e1;
            padding: 10px 14px; border-radius: 10px; font-size: 0.72rem; font-weight: 500;
            white-space: nowrap; border: 1px solid var(--glass-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            opacity: 0; visibility: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none; letter-spacing: 0.3px; line-height: 1.4; text-align: center;
        }
        .nav-links a::before {
            content: ''; position: absolute; bottom: -16px; left: 50%;
            transform: translateX(-50%) translateY(5px); border-width: 5px; border-style: solid;
            border-color: transparent transparent var(--glass-border) transparent;
            opacity: 0; visibility: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none;
        }
        .nav-links a:hover::after, .nav-links a:hover::before {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }

        /* --- CONTAINER & CARD --- */
        .container {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        .header-section {
            display: flex; flex-direction: column; gap: 4px;
            margin-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 20px;
        }

        h1 {
            font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        h1 i { color: var(--primary); }

        .verified-intro {
            font-size: 0.75rem; color: var(--text-dim); font-weight: 500;
            display: flex; align-items: center; gap: 6px; margin-top: 4px;
        }
        .verified-intro i { color: var(--success); font-size: 0.7rem; }

        /* --- ORDER LIST & ITEMS --- */
        .order-list { display: flex; flex-direction: column; gap: 16px; }

        .order-item {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 22px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .order-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(251, 191, 36, 0.1);
        }

        .order-details h3 {
            font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: #fff;
            font-family: 'Roboto Mono', monospace;
        }
        .order-meta { font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; }
        .order-meta i { color: var(--primary); margin-right: 5px; }

        .status-badge {
            padding: 7px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; background: rgba(245, 158, 11, 0.12); color: var(--primary);
            border: 1px solid rgba(245, 158, 11, 0.3); letter-spacing: 0.5px;
        }

        .empty-state { text-align: center; color: var(--text-dim); padding: 50px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <div class="logo-ring">
                <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <span class="brand-title">MarketView <span>[Buyer Terminal]</span></span>
        </div>
        <div class="nav-links">
            <a href="buyer-dashboard.html" data-tooltip="Browse verified vendor catalog, search items, and place direct purchase orders"><i class="fa-solid fa-store"></i> 1. Browse Catalog</a>
            <a href="buyer-orders.html" class="active" data-tooltip="Track active delivery shipments, fulfillment progress, and past order records"><i class="fa-solid fa-truck-ramp-box"></i> 2. Track Purchases</a>
            <a href="buyer-messages.html" data-tooltip="Securely chat with verified vendors and manage direct product inquiries"><i class="fa-solid fa-comments"></i> 3. Merchant Chats</a>
            <a href="../SignUp.html" style="color: var(--danger);" data-tooltip="Securely terminate your active session and log out of the terminal"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-section">
                <h1><i class="fa-solid fa-truck-ramp-box"></i> Placed Purchase Orders</h1>
                <div class="verified-intro">
                    <i class="fa-solid fa-shield-check"></i> Monitor fulfillment status and track verified acquisitions across the marketplace.
                </div>
            </div>
            
            <div class="order-list" id="placedOrdersList">
                <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading your purchase records...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { RetrievePlacedOrder } from '../../Cloud/Functions/RetrievePlacedOrder.js';
        import { RetrieveUserDetails } from '../../Cloud/Functions/RetrieveUserDetails.js';

        async function initUserProfile() {
            try {
                const details = await RetrieveUserDetails();
                if (details && details.length > 0) {
                    const user = details[0];
                    const brandTitle = document.querySelector('.brand-title');
                    if (brandTitle) {
                        brandTitle.innerHTML = `MarketView <span>[Buyer: ${user.name || user.username || 'Terminal'}]</span>`;
                    }
                }
            } catch (err) {
                console.error("Error loading user profile:", err);
            }
        }
        initUserProfile();

        async function loadPlacedOrders() {
            try {
                const orders = await RetrievePlacedOrder();
                const listContainer = document.getElementById('placedOrdersList');
                listContainer.innerHTML = '';

                if (!orders || orders.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">You have not placed any orders yet. Visit the Marketplace to begin trading.</div>';
                    return;
                }

                orders.forEach(order => {
                    const item = document.createElement('div');
                    item.className = 'order-item';
                    item.innerHTML = `
                        <div class="order-details">
                            <h3>Order Ref: #${order.Orderid || order.orderid || 'N/A'}</h3>
                            <div class="order-meta">
                                <i class="fa-solid fa-location-dot"></i> Shipping Destination: ${order.Address || ''}, ${order.city || ''}, ${order.country || ''}<br>
                                <i class="fa-regular fa-calendar"></i> Date Logged: ${order.created_at ? new Date(order.created_at).toLocaleDateString() : 'Recent'}
                            </div>
                        </div>
                        <div class="status-badge">${order.Status || 'Active / Processing'}</div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (err) {
                console.error("Error loading placed orders:", err);
                document.getElementById('placedOrdersList').innerHTML = '<div class="empty-state" style="color: var(--danger);">Failed to load purchase records.</div>';
            }
        }
        loadPlacedOrders();
    </script>
</body>
</html>
